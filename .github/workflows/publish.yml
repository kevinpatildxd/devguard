name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish (prerelease -> next, stable -> latest)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease $VERSION -> publishing under dist-tag 'next'"
            npx --yes npm@^11 publish --access public --provenance --tag next
          else
            echo "Stable $VERSION -> publishing under dist-tag 'latest'"
            npx --yes npm@^11 publish --access public --provenance
          fi
